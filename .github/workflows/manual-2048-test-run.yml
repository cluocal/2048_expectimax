name: Manual 2048 test-run

on:
  workflow_dispatch:
    inputs:
      n-runs:
        description: 'Amount of test-runs'
        default: '1'
        required: false

permissions:
  contents: read

jobs:
  _2048-test-run:

    runs-on: self-hosted
    timeout-minutes: 720

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy
        pip install websocket-client
    - name: run chrome
      run: |
        chromium --headless --disable-gpu --remote-debugging-port=9222 --user-data-dir=remote-profile https://play2048.co/ &
    - name: run 2048 tests
      run: |
        python 2048.py -b chrome -p 9222 -k fast -t True -n ${{ github.event.inputs.n-runs }}
